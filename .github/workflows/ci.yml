name: CI
on:
  push: { branches: [main] }
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Linux Bluetooth headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check the Bluetooth backend
        run: cargo check -p erglite-transport --features ble
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/ui } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/ui/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  tauri:
    name: Tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "app/src-tauri" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config patchelf
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: app/ui
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml
