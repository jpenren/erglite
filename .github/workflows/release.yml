name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: ""
            artifacts: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-latest
            target: "x86_64-pc-windows-msvc"
            artifacts: |
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macOS (x86_64)
            os: macos-latest
            target: "x86_64-apple-darwin"
            artifacts: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/app/*.app.tar.gz
          - name: macOS (aarch64)
            os: macos-latest
            target: "aarch64-apple-darwin"
            artifacts: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/app/*.app.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies and build
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      - name: Build Tauri app with installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "ErgLite ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} --features ble', matrix.target) || '--features ble' }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: ${{ matrix.artifacts }}
          retention-days: 1

  macos-universal:
    name: macOS Universal Installers
    needs: build
    if: runner.os == 'macOS'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macOS*-installers
          path: macos-artifacts
          merge-multiple: true

      - name: Create universal DMG
        run: |
          # Find the DMG files and app bundles from downloaded artifacts
          X86_DMG=$(find macos-artifacts -name "*.dmg" -path "*x86_64*" | head -1)
          ARM_DMG=$(find macos-artifacts -name "*.dmg" -path "*aarch64*" | head -1)
          
          echo "X86 DMG: $X86_DMG"
          echo "ARM DMG: $ARM_DMG"
          
          if [ -n "$X86_DMG" ] && [ -n "$ARM_DMG" ]; then
            # Mount DMGs to extract .app bundles
            mkdir -p x86_64 aarch64 universal
            
            hdiutil attach "$X86_DMG" -mountpoint x86_64/mnt -nobrowse -quiet
            hdiutil attach "$ARM_DMG" -mountpoint aarch64/mnt -nobrowse -quiet
            
            X86_APP=$(find x86_64/mnt -name "*.app" -maxdepth 2 | head -1)
            ARM_APP=$(find aarch64/mnt -name "*.app" -maxdepth 2 | head -1)
            
            echo "X86 App: $X86_APP"
            echo "ARM App: $ARM_APP"
            
            if [ -n "$X86_APP" ] && [ -n "$ARM_APP" ]; then
              mkdir -p universal
              cp -R "$X86_APP" universal/
              UNIVERSAL_APP="universal/$(basename "$X86_APP")"
              lipo -create -output "$UNIVERSAL_APP/Contents/MacOS/ErgLite" "$X86_APP/Contents/MacOS/ErgLite" "$ARM_APP/Contents/MacOS/ErgLite"
              
              # Create universal DMG
              hdiutil create -volname "ErgLite" -srcfolder universal -ov -format UDZO "ErgLite_universal.dmg"
              echo "Universal DMG created"
            else
              echo "Could not find both app bundles"
            fi
            
            hdiutil detach x86_64/mnt -quiet 2>/dev/null || true
            hdiutil detach aarch64/mnt -quiet 2>/dev/null || true
          else
            echo "Could not find both DMGs"
          fi

      - name: Upload universal DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-universal-installers
          path: ErgLite_universal.dmg
          retention-days: 1

  release:
    name: Create Release
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: *-installers
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.app.tar.gz" \) | sort

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ErgLite ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
          generate_release_notes: false