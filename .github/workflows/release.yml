name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: ""
            asset_name: erglite-app-linux.tar.gz
          - name: Windows
            os: windows-latest
            target: "x86_64-pc-windows-msvc"
            asset_name: erglite-app-windows.tar.gz
          - name: macOS (x86_64)
            os: macos-latest
            target: "x86_64-apple-darwin"
            asset_name: erglite-app-macos-x86_64.tar.gz
          - name: macOS (aarch64)
            os: macos-latest
            target: "aarch64-apple-darwin"
            asset_name: erglite-app-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies and build
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (release binary with BLE)
        working-directory: app/src-tauri
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }} --features ble
          else
            cargo build --release --features ble
          fi

      - name: Package binary with README
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            TARGET="${{ matrix.target }}"
            BINARY_PATH="app/src-tauri/target/${TARGET}/release/erglite-app"
            if [ "${{ runner.os }}" = "Windows" ]; then
              BINARY_PATH="${BINARY_PATH}.exe"
            fi
          else
            # Native build (Linux)
            BINARY_PATH="app/src-tauri/target/release/erglite-app"
          fi
          
          echo "Binary path: ${BINARY_PATH}"
          ls -la "${BINARY_PATH}"
          
          # Create package directory
          mkdir -p release-pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${BINARY_PATH}" release-pkg/erglite-app.exe
          else
            cp "${BINARY_PATH}" release-pkg/erglite-app
          fi
          cp README.md release-pkg/
          
          # Create tar.gz
          tar -czf "${{ matrix.asset_name }}" -C release-pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  macos-universal:
    name: macOS Universal Binary
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: erglite-app-macos-*
          path: macos-artifacts
          merge-multiple: true

      - name: Create universal binary
        run: |
          x86_64_BIN="macos-artifacts/erglite-app-macos-x86_64.tar.gz"
          aarch64_BIN="macos-artifacts/erglite-app-macos-aarch64.tar.gz"
          
          # Extract both
          mkdir -p x86_64 aarch64 universal
          tar -xzf "${x86_64_BIN}" -C x86_64
          tar -xzf "${aarch64_BIN}" -C aarch64
          
          # Create universal binary with lipo
          lipo -create -output universal/erglite-app x86_64/erglite-app aarch64/erglite-app
          
          # Verify
          file universal/erglite-app
          
          # Copy README
          cp x86_64/README.md universal/
          
          # Create universal tar.gz
          tar -czf erglite-app-macos.tar.gz -C universal .

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: erglite-app-macos.tar.gz
          path: erglite-app-macos.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: erglite-app-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ErgLite ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/erglite-app-linux.tar.gz
            artifacts/erglite-app-windows.tar.gz
            artifacts/erglite-app-macos.tar.gz
          generate_release_notes: false