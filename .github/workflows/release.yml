name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: ""
            asset_name: erglite-app-linux-${{ github.ref_name }}.tar.gz
          - name: Windows
            os: windows-latest
            target: ""
            asset_name: erglite-app-windows-${{ github.ref_name }}.tar.gz
          - name: macOS (Universal)
            os: macos-latest
            target: "--target universal-apple-darwin"
            asset_name: erglite-app-macos-${{ github.ref_name }}.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies and build
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (release binary)
        working-directory: app/src-tauri
        run: cargo build --release ${{ matrix.target }}

      - name: Package binary with README
        run: |
          BINARY_NAME="erglite-app${{ runner.os == 'Windows' && '.exe' || '' }}"
          BINARY_PATH="app/src-tauri/target/${{ matrix.target != '' && 'universal-apple-darwin' || 'x86_64-unknown-linux-gnu' }}/release/${BINARY_NAME}"
          # On macOS universal, the binary is at a different path
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            BINARY_PATH="app/src-tauri/target/universal-apple-darwin/release/${BINARY_NAME}"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            BINARY_PATH="app/src-tauri/target/x86_64-pc-windows-msvc/release/${BINARY_NAME}"
          fi
          
          echo "Binary path: ${BINARY_PATH}"
          ls -la "${BINARY_PATH}"
          
          # Create package directory
          mkdir -p release-pkg
          cp "${BINARY_PATH}" release-pkg/erglite-app${{ runner.os == 'Windows' && '.exe' || '' }}
          cp README.md release-pkg/
          
          # Create tar.gz
          tar -czf "${{ matrix.asset_name }}" -C release-pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: erglite-app-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ErgLite ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/erglite-app-linux-*.tar.gz
            artifacts/erglite-app-windows-*.tar.gz
            artifacts/erglite-app-macos-*.tar.gz
          generate_release_notes: false