name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage)
            os: ubuntu-22.04
            target: ""
            asset_name: ErgLite_${{ github.ref_name }}_amd64.AppImage
            asset_type: appimage
          - name: Linux (DEB)
            os: ubuntu-22.04
            target: ""
            asset_name: ErgLite_${{ github.ref_name }}_amd64.deb
            asset_type: deb
          - name: Linux (RPM)
            os: ubuntu-22.04
            target: ""
            asset_name: ErgLite-${{ github.ref_name }}-1.x86_64.rpm
            asset_type: rpm
          - name: Windows (MSI)
            os: windows-latest
            target: ""
            asset_name: ErgLite_${{ github.ref_name }}_x64_en-US.msi
            asset_type: msi
          - name: Windows (EXE)
            os: windows-latest
            target: ""
            asset_name: ErgLite_${{ github.ref_name }}_x64-setup.exe
            asset_type: nsis
          - name: macOS (Universal DMG)
            os: macos-latest
            target: "--target universal-apple-darwin"
            asset_name: ErgLite_${{ github.ref_name }}_universal.dmg
            asset_type: dmg
          - name: macOS (Universal App)
            os: macos-latest
            target: "--target universal-apple-darwin"
            asset_name: ErgLite_${{ github.ref_name }}_universal.app.tar.gz
            asset_type: app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies and build
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "ErgLite ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target }}

      - name: Upload additional assets (README, etc.)
        if: always()
        run: |
          # Copy README to release artifacts
          cp README.md release-README.md

  # Create final release with all artifacts
  release:
    name: Create Release
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          find artifacts -type f -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.app.tar.gz" | sort

      - name: Create release with all assets
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ github.ref_name }}
          name: "ErgLite ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.app.tar.gz
          generate_release_notes: false