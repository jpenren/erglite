name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: ""
            artifacts: |
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/rpm/*.rpm
              app/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-latest
            target: "x86_64-pc-windows-msvc"
            artifacts: |
              app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macOS (x86_64)
            os: macos-latest
            target: "x86_64-apple-darwin"
            artifacts: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/app/*.app.tar.gz
          - name: macOS (aarch64)
            os: macos-latest
            target: "aarch64-apple-darwin"
            artifacts: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/app/*.app.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies and build
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      - name: Build Tauri app with installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "ErgLite ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} --features ble', matrix.target) || '--features ble' }}

      - name: Debug bundle output
        run: |
          echo "Listing bundle directories for ${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "" ]; then
            # Linux: use hardcoded path without target variable
            ls -la app/src-tauri/target/release/bundle/ 2>/dev/null || echo "Bundle directory not found"
          else
            # macOS/Windows: use target variable
            ls -la target/${{ matrix.target }}/release/bundle/ 2>/dev/null || echo "Bundle directory not found"
          fi
          find target/${{ matrix.target }}/release/bundle/ -type f -name "*.dmg" -o -name "*.app.tar.gz" 2>/dev/null | head -10 || echo "No files found"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-installers
          path: ${{ matrix.artifacts }}
          retention-days: 1

  macos-universal:
    name: macOS Universal Installers
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'macOS*-installers'
          path: macos-artifacts
          merge-multiple: true
      - name: Debug artifacts
        run: |
          ls -la macos-artifacts/ || true
          find macos-artifacts -type f 2>/dev/null | head -20 || true

      - name: Find DMG files
        run: |
          echo "DMG files found:"
          find macos-artifacts -type f -name "*.dmg" | head -20

      - name: Create universal DMG
        if: always()
        run: |
          # Try to find DMG files for both architectures
          X86_DMG=$(find macos-artifacts -type f -name "*.dmg" | head -1 || true)
          ARM_DMG=$(find macos-artifacts -type f -name "*.dmg" | tail -1 || true)
           
          echo "X86 DMG: $X86_DMG"
          echo "ARM DMG: $ARM_DMG"
           
          # Create universal DMG from the two DMGs if both exist
          if [ -n "$X86_DMG" ] && [ -n "$ARM_DMG" ]; then
            mkdir -p x86_64 aarch64 universal
            
            # Mount the DMGs to extract the .app bundles
            hdiutil attach "$X86_DMG" -mountpoint x86_64/mnt -nobrowse -quiet
            hdiutil attach "$ARM_DMG" -mountpoint aarch64/mnt -nobrowse -quiet
            
            X86_APP=$(find x86_64/mnt -name "*.app" -maxdepth 2 | head -1)
            ARM_APP=$(find aarch64/mnt -name "*.app" -maxdepth 2 | head -1)
            
            if [ -n "$X86_APP" ] && [ -n "$ARM_APP" ]; then
              mkdir -p universal
              cp -R "$X86_APP" universal/
              UNIVERSAL_APP="universal/$(basename "$X86_APP")"
               
              # Debug: List what's in the app bundles
              echo "DEBUG: Listing x86_64 Contents/MacOS:"
              find "$X86_APP/Contents/MacOS" -type f 2>/dev/null | head -10 || echo "No files found"
              echo "DEBUG: Listing aarch64 Contents/MacOS:"
              find "$ARM_APP/Contents/MacOS" -type f 2>/dev/null | head -10 || echo "No files found"
               
              # Try to find the binary - ErgLite is the typical Tauri app binary name
              X86_BIN=$(find "$X86_APP/Contents/MacOS" -type f -name "ErgLite" 2>/dev/null | head -1)
              ARM_BIN=$(find "$ARM_APP/Contents/MacOS" -type f -name "ErgLite" 2>/dev/null | head -1)
               
              # If not found, try alternative names
              if [ -z "$X86_BIN" ]; then
                X86_BIN=$(find "$X86_APP/Contents/MacOS" -type f -name "ergolite" -o -name "binary" -o -name "app" 2>/dev/null | head -1)
              fi
              if [ -z "$ARM_BIN" ]; then
                ARM_BIN=$(find "$ARM_APP/Contents/MacOS" -type f -name "ergolite" -o -name "binary" -o -name "app" 2>/dev/null | head -1)
              fi
               
              echo "DEBUG: X86_BIN=$X86_BIN"
              echo "DEBUG: ARM_BIN=$ARM_BIN"
               
              if [ -n "$X86_BIN" ] && [ -n "$ARM_BIN" ]; then
                # Create universal binary with lipo
                lipo -create -output "$UNIVERSAL_APP/Contents/MacOS/ErgLite" "$X86_BIN" "$ARM_BIN"
                echo "Binary merging successful"
              else
                echo "Could not find ErgLite binary in app bundles"
                # Fallback: just copy the entire apps without binary merging
                # This will create a universal DMG but each arch will have its own binary
                cp -R "$X86_APP" universal/ErgLite_x64.app 2>/dev/null || true
                cp -R "$ARM_APP" universal/ErgLite_arm64.app 2>/dev/null || true
                echo "Copied apps as-is (no binary merge)"
              fi
               
              # Create universal DMG
              hdiutil create -volname "ErgLite" -srcfolder universal -ov -format UDZO "ErgLite_universal.dmg"
              echo "Universal DMG created"
            else
              echo "Could not find both app bundles inside DMGs"
            fi
            
            hdiutil detach x86_64/mnt -quiet 2>/dev/null || true
            hdiutil detach aarch64/mnt -quiet 2>/dev/null || true
          elif [ -n "$X86_DMG" ]; then
            # Only x86_64 DMG found, copy it as-is
            cp "$X86_DMG" ErgLite_universal.dmg
            echo "Only x86_64 DMG found, copied as-is"
          elif [ -n "$ARM_DMG" ]; then
            # Only ARM DMG found, copy it as-is
            cp "$ARM_DMG" ErgLite_universal.dmg
            echo "Only ARM DMG found, copied as-is"
          else
            echo "No DMG files found"
          fi

      - name: Upload universal DMG
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macOS-universal-installers
          path: ErgLite_universal.dmg
          retention-days: 1

  release:
    name: Create Release
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-installers'
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.app.tar.gz" \) | sort

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ErgLite ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
          generate_release_notes: false