name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, args: "" }
          - { os: windows-latest, args: "" }
          - { os: macos-latest, args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config patchelf
      - run: npm ci
        working-directory: app/ui
      - uses: tauri-apps/tauri-action@v1
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "ErgLite ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
