<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route editor</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>body{margin:0}button{font:inherit;cursor:pointer;min-height:44px;border-radius:10px;padding:0 16px;border:1px solid #3A4654;background:#1A222C;color:#E8EDF2;font-weight:600}input{font:inherit;min-height:44px;box-sizing:border-box;width:100%;border-radius:8px;border:1px solid #3A4654;background:#0F1419;color:#E8EDF2;padding:0 12px}label{display:flex;flex-direction:column;gap:4px;color:#9AA7B4;font-size:14px}a{color:#C5CFDA;text-decoration:none;padding:12px 14px;border-radius:8px;display:block}.n{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}.c{background:#141B23;border-radius:12px;padding:16px 18px;box-sizing:border-box}.k{display:flex;align-items:center;gap:6px;font-size:14px;color:#C5CFDA}.k i{width:14px;height:14px;border-radius:3px;display:inline-block}</style>
</head><body>

<div style="width:100%;height:720px;box-sizing:border-box;background:#0F1419;color:#E8EDF2;font-family:Barlow,sans-serif;display:flex">
<nav style="width:200px;background:#141B23;padding:24px 12px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box"><div style="font-weight:700;font-size:22px;padding:0 14px 20px">ErgLite</div><a href="#">Home</a><a href="#">Devices</a><a href="#">Library</a><a href="#">Editor</a><a href="#" style="background:#1F2A36;color:#fff;font-weight:600">Routes</a><a href="#">History</a><a href="#">Settings</a></nav>
<main style="flex:1;padding:28px 40px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;gap:16px;align-items:flex-end"><label style="width:300px">Name<input value="10 km circuit"></label><label style="width:120px">Distance<input value="10 km"></label><label style="width:120px">Resolution<input value="100 m"></label><label style="width:120px">Est. power<input value="200 W"></label><button type="button" style="margin-left:auto;background:#F2C94C;color:#0F1419;border:none;min-height:48px">Save and ride</button></div>
<div style="display:flex;gap:28px;align-items:baseline"><div class="n" style="font-size:34px">≈ 21:30 <span style="font-size:18px;color:#9AA7B4">at 200 W</span></div><div style="color:#C5CFDA;font-size:17px">Elevation gain + <b>190 m</b> · Max. climb <b>5 %</b> · Max. descent <b>−7 %</b></div></div>
<div class="c" style="padding:10px 14px">
<svg viewBox="0 0 760 232" width="100%" role="img" aria-label="Elevation profile over 10 km: a climb up to km 6, a descent to km 8, a 5 % ramp at km 9 and a final 7 % descent">
<g font-size="13" fill="#9AA7B4" font-family="Barlow,sans-serif"><text x="0" y="54">240 m</text><text x="0" y="124">170 m</text><text x="0" y="194">100 m</text>
<text x="24" y="220">0</text><text x="94" y="220">1</text><text x="164" y="220">2</text><text x="234" y="220">3</text><text x="304" y="220">4</text><text x="374" y="220">5</text><text x="444" y="220">6</text><text x="514" y="220">7</text><text x="584" y="220">8</text><text x="654" y="220">9</text><text x="720" y="220">10 km</text></g>
<polygon points="30,200 30,190 100,190 100,200" fill="#9AA7B4"/><polygon points="100,200 100,190 170,175 170,200" fill="#9AA7B4"/><polygon points="170,200 170,175 240,150 240,200" fill="#F4A9D2"/><polygon points="240,200 240,150 310,120 310,200" fill="#F4A9D2"/><polygon points="310,200 310,120 380,80 380,200" fill="#E8589F"/><polygon points="380,200 380,80 450,50 450,200" fill="#F4A9D2"/><polygon points="450,200 450,50 520,80 520,200" fill="#8FB8FF"/><polygon points="520,200 520,80 590,120 590,200" fill="#8FB8FF"/><polygon points="590,200 590,120 660,70 660,200" fill="#E8589F"/><polygon points="660,200 660,70 730,140 730,200" fill="#4C7DFF"/>
<polyline points="30,190 100,190 170,175 240,150 310,120 380,80 450,50 520,80 590,120 660,70 730,140" fill="none" stroke="#fff" stroke-width="2"/>
<g fill="#0F1419" stroke="#fff" stroke-width="2"><circle cx="30" cy="190" r="6"/><circle cx="100" cy="190" r="6"/><circle cx="170" cy="175" r="6"/><circle cx="240" cy="150" r="6"/><circle cx="310" cy="120" r="6"/><circle cx="380" cy="80" r="6"/><circle cx="450" cy="50" r="6"/><circle cx="520" cy="80" r="6"/><circle cx="590" cy="120" r="6"/><circle cx="730" cy="140" r="6"/></g>
<circle cx="660" cy="70" r="9" fill="#fff"/><rect x="585" y="22" width="150" height="26" rx="6" fill="#fff"/><text x="595" y="40" font-size="14" font-weight="700" fill="#0F1419" font-family="Barlow,sans-serif">km 9 · 220 m · 5 %</text></svg>
<div style="display:flex;gap:16px;flex-wrap:wrap;padding:4px 0 6px"><span class="k"><i style="background:#4C7DFF"></i>Steep descent (&lt; −5 %)</span><span class="k"><i style="background:#8FB8FF"></i>Descent (−5 to −2 %)</span><span class="k"><i style="background:#9AA7B4"></i>Flat (±2 %)</span><span class="k"><i style="background:#F4A9D2"></i>Climb (2 to 4 %)</span><span class="k"><i style="background:#E8589F"></i>Hard (4 to 6 %)</span><span class="k"><i style="background:#B8125E"></i>Very hard (&gt; 6 %)</span></div></div>
<div style="display:flex;gap:10px"><button type="button">Freehand draw</button><button type="button" style="background:#1F2A36;border-color:#F2C94C">Move nodes</button><button type="button">Constant grade</button><button type="button">Templates</button><button type="button">Import GPX</button><button type="button">Smooth</button></div>
<div style="display:flex;gap:20px;flex:1">
<div class="c" style="flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-content:start"><div style="grid-column:span 3;font-weight:700">Selected section · km 8 to 9</div><label>Grade<input value="5 %"></label><label>Length<input value="1.0 km"></label><label>Elevation gain<input value="+ 50 m"></label></div>
<div class="c" style="flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-content:start"><div style="grid-column:span 3;font-weight:700">Trainer feel</div><label>Difficulty<input value="100 %"></label><label>Smoothing<input value="30 m"></label><label>Max. grade<input value="± 12 %"></label></div></div>
</main></div>
</body></html>
