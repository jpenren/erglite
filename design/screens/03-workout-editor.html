<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>body{margin:0}button{font:inherit;cursor:pointer;min-height:44px;border-radius:10px;padding:0 16px;border:1px solid #3A4654;background:#1A222C;color:#E8EDF2;font-weight:600}input{font:inherit;min-height:44px;box-sizing:border-box;width:100%;border-radius:8px;border:1px solid #3A4654;background:#0F1419;color:#E8EDF2;padding:0 12px}label{display:flex;flex-direction:column;gap:4px;color:#9AA7B4;font-size:14px}a{color:#C5CFDA;text-decoration:none;padding:12px 14px;border-radius:8px;display:block}.n{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}.b{flex-shrink:0;border-radius:3px 3px 0 0}td,th{text-align:left;padding:12px 10px;border-bottom:1px solid #2A3440}th{color:#9AA7B4;font-weight:600;font-size:14px}</style>
</head><body>

<div style="width:100%;height:720px;box-sizing:border-box;background:#0F1419;color:#E8EDF2;font-family:Barlow,sans-serif;display:flex">
<nav style="width:200px;background:#141B23;padding:24px 12px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box"><div style="font-weight:700;font-size:22px;padding:0 14px 20px">ErgLite</div><a href="#">Home</a><a href="#">Devices</a><a href="#">Library</a><a href="#" style="background:#1F2A36;color:#fff;font-weight:600">Editor</a><a href="#">History</a><a href="#">Settings</a></nav>
<main style="flex:1;padding:28px 40px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;gap:20px;align-items:flex-end"><label style="width:340px">Name<input value="Sweet Spot 3×8"></label><label style="width:110px">FTP<input value="230 W"></label><div class="n" style="font-size:34px;margin-left:auto">58:00 <span style="font-size:20px;color:#9AA7B4">· TSS ≈ 60</span></div><button type="button" style="background:#F2C94C;color:#0F1419;border:none">Save and ride</button></div>
<div style="position:relative;height:190px;background:#141B23;border-radius:12px;padding:14px 14px 0;display:flex;align-items:flex-end;gap:2px">
<div class="b" style="flex:5;height:81px;background:#7C8A99"></div><div class="b" style="flex:5;height:108px;background:#4C9AFF"></div><div class="b" style="flex:4;height:126px;background:#4C9AFF"></div>
<div class="b" style="flex:8;height:171px;background:#F2C94C;outline:3px solid #fff"></div><div class="b" style="flex:4;height:99px;background:#7C8A99"></div><div class="b" style="flex:8;height:171px;background:#F2C94C"></div><div class="b" style="flex:4;height:99px;background:#7C8A99"></div><div class="b" style="flex:8;height:171px;background:#F2C94C"></div><div class="b" style="flex:6;height:108px;background:#4C9AFF"></div><div class="b" style="flex:6;height:81px;background:#7C8A99"></div>
<div style="position:absolute;left:25%;top:8px;font-size:14px;background:#fff;color:#0F1419;padding:2px 8px;border-radius:6px;font-weight:600">8:00 · 95 % · 218 W</div></div>
<div style="display:flex;gap:10px"><button type="button">+ Warm-up</button><button type="button">+ Steady</button><button type="button">+ Ramp</button><button type="button">+ Intervals</button><button type="button">+ Free</button></div>
<div style="display:flex;gap:24px;flex:1">
<table style="flex:1;border-collapse:collapse;font-size:17px;align-self:flex-start"><tr><th>#</th><th>Type</th><th>Duration</th><th>Target</th></tr><tr><td>1</td><td>Warm-up</td><td>14:00</td><td>45 → 70 % FTP</td></tr><tr style="background:#1F2A36"><td>2</td><td><b>Intervals</b></td><td>3 × 8:00</td><td>95 % / 55 %</td></tr><tr><td>3</td><td>Cool-down</td><td>12:00</td><td>60 → 45 % FTP</td></tr></table>
<div style="width:320px;background:#141B23;border-radius:12px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;box-sizing:border-box"><div style="grid-column:span 2;font-weight:700">Block 2 · Intervals</div><label>Work<input value="8:00"></label><label>Rest<input value="4:00"></label><label>Repeats<input value="3"></label><label>Cadence<input value="90 rpm"></label><label>Work target<input value="95 % · 218 W"></label><label>Rest target<input value="55 % · 127 W"></label><label style="grid-column:span 2">On-screen message<input value="Keep the cadence"></label></div></div>
</main></div>
</body></html>
